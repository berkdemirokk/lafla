name: Supabase Deploy

# 2026-05-23 — Manuel dispatch only. Auto-trigger yok (yanlış migration push'lamak
# hard-to-undo). Sen workflow_dispatch tıklayınca migration + edge functions deploy.
#
# NE YAPAR (input'lara göre):
#   - migrations=true → supabase db push (00004_apple_credentials.sql vs.)
#   - functions=true  → apple-token-exchange + delete-account deploy
#   - all=true        → ikisi de
#
# NE YAPMAZ:
#   - Secrets set (APPLE_SIGNIN_*) — sen Dashboard'dan ekle, güvenli yol
#   - Migration rollback (Supabase migration history append-only)
#   - Project creation
#
# ÖNKOŞUL (one-time, ~5 dk):
#   1. Supabase Dashboard → Account → Access Tokens → Generate new token
#   2. GitHub → Repo Settings → Secrets and variables → Actions →
#      New repository secret: SUPABASE_ACCESS_TOKEN
#
# Sonrası: `gh workflow run supabase-deploy.yml -f all=true`

on:
  workflow_dispatch:
    inputs:
      migrations:
        description: "Deploy migrations? (supabase db push)"
        required: true
        type: boolean
        default: false
      functions:
        description: "Deploy edge functions? (apple-token-exchange + delete-account)"
        required: true
        type: boolean
        default: false
      all:
        description: "Shortcut: deploy both"
        required: true
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dljlqmzjfewevoxibdlh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret eksik. Supabase Dashboard → Account → Access Tokens'tan üret, GitHub Repo Secrets'a ekle."
            exit 1
          fi
          echo "Token present (length: ${#SUPABASE_ACCESS_TOKEN})"

      - name: Deploy migrations
        if: ${{ inputs.migrations == true || inputs.all == true }}
        run: |
          echo "=== Migrations ==="
          supabase db push --project-ref "$PROJECT_REF" --include-all || {
            echo "::error::Migration push failed"
            exit 1
          }

      - name: Deploy apple-token-exchange function
        if: ${{ inputs.functions == true || inputs.all == true }}
        run: |
          echo "=== apple-token-exchange ==="
          supabase functions deploy apple-token-exchange --project-ref "$PROJECT_REF" --no-verify-jwt=false

      - name: Deploy delete-account function
        if: ${{ inputs.functions == true || inputs.all == true }}
        run: |
          echo "=== delete-account ==="
          supabase functions deploy delete-account --project-ref "$PROJECT_REF" --no-verify-jwt=false

      - name: Summary
        run: |
          echo "==================="
          echo "Deploy Summary"
          echo "==================="
          echo "Migrations: ${{ inputs.migrations == true || inputs.all == true }}"
          echo "Functions:  ${{ inputs.functions == true || inputs.all == true }}"
          echo ""
          echo "Sonraki adım: Apple Sign-In secrets ekle (sadece Dashboard'dan):"
          echo "  Supabase Dashboard → Project → Settings → Edge Functions → Secrets"
          echo "    APPLE_TEAM_ID            = 44B88YK392"
          echo "    APPLE_SIGNIN_SERVICE_ID  = com.lafla.signinwithapple.service"
          echo "    APPLE_SIGNIN_KEY_ID      = (Apple Developer'dan)"
          echo "    APPLE_SIGNIN_PRIVATE_KEY = (.p8 contents)"
