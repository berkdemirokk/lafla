name: Lafla iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - "lafla-v*"

jobs:
  database-tests:
    uses: ./.github/workflows/supabase-test.yml

  build-and-upload:
    needs: database-tests
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: dljlqmzjfewevoxibdlh
      # 2026-05-20: GitHub Actions Node 20 deprecation kicks in 2026-06-02.
      # All upstream actions used here (actions/checkout@v4, setup-node@v4,
      # cache@v4, upload-artifact@v4, apple-actions/upload-testflight-build@v3,
      # expo/expo-github-action@v8, pnpm/action-setup@v4) still ship Node 20
      # by default. Force them to Node 24 now so we catch any breakage before
      # GitHub flips it automatically. If a specific action fails on Node 24,
      # we'll pin the offending action version rather than reverting this.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release secrets
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          REVENUECAT_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          for name in EXPO_TOKEN APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_URL SUPABASE_KEY SENTRY_DSN REVENUECAT_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required release secret is missing: $name"
              exit 1
            fi
          done
          [ -n "$POSTHOG_KEY" ] || echo "::warning::EXPO_PUBLIC_POSTHOG_KEY is missing; product analytics will be disabled"
          [ -n "$SENTRY_AUTH_TOKEN" ] || echo "::warning::SENTRY_AUTH_TOKEN is missing; source-map upload is not verified"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Select latest Xcode (26+ required for App Store as of May 2026)
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          echo "Selected: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Setup Expo / EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run mobile tests
        run: pnpm --filter @lafla/mobile exec jest --runInBand

      - name: Audit roleplay content
        run: pnpm --filter @lafla/mobile qa:content

      - name: Verify linguist review sample
        run: pnpm --filter @lafla/mobile qa:linguist:check

      - name: Verify Expo dependencies
        run: pnpm dlx expo-doctor@latest apps/mobile

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Edge Function Deno tests
        run: deno test --allow-read supabase/functions/

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Deploy Supabase migrations
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is missing"
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD secret is missing"
            exit 1
          fi
          supabase db push \
            --project-ref "$PROJECT_REF" \
            --include-all \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Supabase Edge Functions
        shell: bash
        run: |
          echo "=== Deploying llm-chat ==="
          supabase functions deploy llm-chat --project-ref "$PROJECT_REF" --no-verify-jwt=false
          echo "=== Deploying delete-account ==="
          supabase functions deploy delete-account --project-ref "$PROJECT_REF" --no-verify-jwt=false
          echo "=== Deploying apple-token-exchange ==="
          supabase functions deploy apple-token-exchange --project-ref "$PROJECT_REF" --no-verify-jwt=false
          echo "=== Deploying revenuecat-webhook ==="
          supabase functions deploy revenuecat-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
          echo "=== Deploying revenuecat-sync ==="
          supabase functions deploy revenuecat-sync --project-ref "$PROJECT_REF" --no-verify-jwt=false

      - name: Write App Store Connect API key
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
          cat > "$API_KEY_PATH" <<'EOF'
          ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          EOF
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: EAS Build (local IPA)
        working-directory: apps/mobile
        env:
          EXPO_ASC_API_KEY_PATH: ${{ env.API_KEY_PATH }}
          EXPO_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
          # Telemetry creds — app.config.ts EXPO_PUBLIC_* env'lerinden okur.
          # Secret eklenmemişse empty string olur → Sentry/PostHog init() skip eder,
          # crash-safe (lib/sentry.ts + lib/analytics.ts defensive). Secret eklenince
          # tag bas → otomatik canlanır.
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          EXPO_PUBLIC_TTS_ENDPOINT: ${{ secrets.EXPO_PUBLIC_TTS_ENDPOINT }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          # Sourcemap upload için — runtime'a değmez, sadece sentry-cli kullanır.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          eas build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --clear-cache \
            --output "$RUNNER_TEMP/lafla.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: lafla-ios-ipa
          path: ${{ runner.temp }}/lafla.ipa
          retention-days: 30

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ runner.temp }}/lafla.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
