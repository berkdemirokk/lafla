workflows:
  ios-testflight:
    name: Lafla iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        # User must create this group in Codemagic UI with these vars:
        #   APP_STORE_CONNECT_PRIVATE_KEY  (full .p8 file contents)
        #   APP_STORE_CONNECT_KEY_IDENTIFIER  (e.g. "F97CLHFMKB")
        #   APP_STORE_CONNECT_ISSUER_ID  (UUID from ASC API key page)
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "Lafla.xcworkspace"
        XCODE_SCHEME: "Lafla"
        BUNDLE_ID: "com.lafla.app"
      node: 20
      cocoapods: default
    triggering:
      events: []  # manual trigger only; turn this on later for auto-build on push
    scripts:
      - name: Install pnpm
        script: |
          npm install -g pnpm@9
      - name: Install workspace deps
        script: |
          pnpm install
      - name: Expo prebuild (generate iOS native project)
        script: |
          cd apps/mobile
          npx expo prebuild --platform ios --clean --non-interactive
      - name: Pod install
        script: |
          cd apps/mobile/ios
          pod install
      - name: Configure code signing via ASC API
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd apps/mobile/ios
          # Use unix timestamp as build number to avoid conflicts
          BUILD_NUMBER=$(date +%s)
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build .ipa
        script: |
          cd apps/mobile/ios
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - apps/mobile/ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers  # Optional: create this in App Store Connect → TestFlight
