appId: com.lafla.app
name: Lafla critical launch and onboarding smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "auth-skip"
    timeout: 20000
- assertVisible: "Lafla"
- tapOn:
    id: "auth-skip"
- extendedWaitUntil:
    visible:
      id: "onboarding-screen"
    timeout: 10000
- assertVisible:
    id: "onboarding-screen"
